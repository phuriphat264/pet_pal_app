services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: petpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petpal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petpal}
      POSTGRES_DB: ${POSTGRES_DB:-petpal}
    ports:
      - "5433:5432"
    volumes:
      - petpal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petpal} -d ${POSTGRES_DB:-petpal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: petpal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-petpal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-petpal12345}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - petpal-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: petpal-api
    container_name: petpal-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-petpal}:${POSTGRES_PASSWORD:-petpal}@postgres:5432/${POSTGRES_DB:-petpal}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}

volumes:
  petpal-postgres-data:
  petpal-minio-data:
