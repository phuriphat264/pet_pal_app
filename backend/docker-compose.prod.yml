services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: petpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - petpal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No port exposure -- only accessible inside Docker network

  minio:
    image: minio/minio:latest
    container_name: petpal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - petpal-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Port 9000 exposed only to Nginx via internal network
    # Port 9001 (MinIO console) — access via SSH tunnel only in production

  livekit:
    image: livekit/livekit-server:latest
    container_name: petpal-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"    # WebSocket -- Nginx proxies this
      - "7881:7881"    # TCP RTC
      - "50000-50019:50000-50019/udp"  # UDP RTC media -- must be open in firewall
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50019
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

  redis:
    image: redis:7-alpine
    container_name: petpal-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - petpal-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  petpal-backend:
    build: .
    image: petpal-api
    container_name: petpal-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      REDIS_URL: redis://redis:6379
    # No direct port exposure -- Nginx is the only entry point

  nginx:
    image: nginx:alpine
    container_name: petpal-nginx
    restart: unless-stopped
    depends_on:
      - petpal-backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - default

volumes:
  petpal-postgres-data:
  petpal-minio-data:
  petpal-redis-data:
